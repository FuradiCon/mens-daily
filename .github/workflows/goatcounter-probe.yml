# TEMPORARY — delete after capturing the response shape.
name: GoatCounter Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GoatCounter API
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          BASE="https://furadi.goatcounter.com/api/v0"
          START=$(date -u -d '14 days ago' +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          echo "Window: $START -> $END"

          probe () {
            echo ""
            echo "===== GET $1 ====="
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "$BASE$1")
            echo "HTTP $code"
            cat /tmp/body.json
            echo ""
          }

          probe "/me"
          probe "/stats/total?start=$START&end=$END"
          probe "/stats/hits?start=$START&end=$END&daily=true"
