name: Daily Verse Update

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's verse, video, and reflection
        run: python scripts/generate_daily.py

      - name: Record page traffic
        continue-on-error: true  # a secondary metric must never block the day's actual content from publishing
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: python scripts/record_traffic.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json traffic.json usage.json
          git diff --cached --quiet || git commit -m "Update daily verse $(date -u +'%Y-%m-%d')"
          git push
