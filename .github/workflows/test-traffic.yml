name: Test Traffic PAT

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: python scripts/record_traffic.py
